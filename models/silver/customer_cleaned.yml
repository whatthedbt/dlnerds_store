version: 2

models:
- name: customer_cleaned
  description: "Cleaned customer data"
  columns:
    - name: id
      data_type: varchar
      tests:
        - unique
        
      description: ""

    - name: name
      data_type: varchar
      description: ""

    - name: gender
      data_type: varchar
      description: ""

    - name: date_of_birth
      data_type: date
      description: ""

    - name: email
      data_type: varchar
      description: ""

    - name: country_code
      data_type: varchar
      tests:
        - not_null
      description: ""

    - name: city
      data_type: varchar
      description: ""

    - name: created_at
      data_type: timestamp_ntz
      description: ""

    - name: updated_at
      data_type: timestamp_ntz
      description: ""
